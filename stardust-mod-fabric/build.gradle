plugins {
    // 1.19.x — первая линия loom с поддержкой Minecraft 26.x (Java 25).
    // Plugin id net.fabricmc.fabric-loom = non-obfuscated путь (26.x):
    // loom пропускает весь remapping. Старый id 'fabric-loom' включает
    // obf-режим и требует mappings, которых для 26.x больше нет.
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = '0.4.9'
group = 'dev.stardust'

base {
    // Суффикс -fabric отличает jar от NeoForge-версии в релизе mod-v*:
    // оба файла живут в одном GitHub Release, deploy-mod выбирает по loader_kind.
    archivesName = 'stardust-mod-fabric'
}

java {
    // Minecraft 26.2 собран под Java 25 (java-runtime-epsilon) — toolchain
    // и options.release должны совпадать, иначе классы не загрузятся.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            // Only resolve TAB's API from JitPack.
            includeGroup 'com.github.NEZNAMY'
        }
    }
    maven {
        name = 'lucko'
        url = 'https://repo.lucko.me/'
        content {
            includeModule 'me.lucko', 'spark-api'
        }
    }
}

dependencies {
    // Minecraft 26.2 / Fabric Loader 0.20.x — matches what the launcher provisions.
    // С 26.x Minecraft поставляется НЕобфусцированным (1.21.11 — последняя
    // обфусцированная версия): маппинги не объявляются вовсе, loom 1.14+
    // с plugin id fabric-loom сам пропускает весь remapping. Код уже в
    // Mojang-именах (net.minecraft.server.level.ServerPlayer, Component),
    // поэтому компилируется напрямую против классов игры.
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.20.1"

    // События жизненного цикла сервера (ServerLifecycleEvents, CommandRegistrationCallback).
    // Fabric-API качаем целиком: на сборке игрока он всё равно стоит.
    // В non-obf режиме — implementation, как в эталоне fabric-example-mod 26.2.
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"

    // TAB's developer API. compileOnly: TAB is installed as a separate mod on
    // the server at runtime and provides these classes. Never shade/relocate it.
    compileOnly 'com.github.NEZNAMY:TAB-API:5.2.1'
    // Spark API — TPS/MSPT from the profiler. compileOnly: Spark is a separate mod.
    compileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'
    // Gson приходит с Minecraft (classpath лоадера), как и в NeoForge-версии.
    // Явная зависимость не нужна: implementation затянул бы вторую копию в jar.
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// Loom подставляет ${version} в fabric.mod.json через processResources.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
