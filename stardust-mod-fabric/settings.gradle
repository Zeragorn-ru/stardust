pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Toolchain-резолвер: сборка требует Java 25 (Minecraft 26.2). Gradle сам
    // скачает JDK 25, если в системе только 21 (CI-раннер mod-fabric на 25).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'stardust-mod-fabric'
