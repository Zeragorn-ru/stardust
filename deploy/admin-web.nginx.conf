# nginx для admin-web: раздаёт собранную SPA и проксирует запросы к admin-server.
#
# admin-server наружу не публикуется — единственная публичная точка входа это
# nginx. Лаунчер ходит за манифестом и файлами сборки через тот же хост
# (/manifest и /files), поэтому FILES_BASE_URL у admin-server должен указывать
# на публичный https://<host>/files.

server {
    listen 80;
    server_name _;

    # Docker DNS. Резолвим admin-server в рантайме (через переменную в
    # proxy_pass), а не один раз при старте через upstream{}. Иначе если
    # admin-server ещё не поднялся, nginx падает с "host not found in upstream"
    # и уходит в crash-loop, утаскивая за собой публичную точку входа.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_server admin-server:8081;

    root /usr/share/nginx/html;
    index index.html;

    # Крупные jar-моды: держим заодно с лимитом тела axum (512 МБ).
    client_max_body_size 512m;

    # API админки.
    location /api/ {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгие загрузки файлов не должны рваться по таймауту.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Health-check деплоя: пробрасываем на admin-server (иначе SPA fallback
    # отдаёт index.html с 200 и маскирует упавший API).
    location = /health {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
    }

    # Публичные маршруты для лаунчера.
    location = /manifest {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Лента новостей лаунчера. Без этих точных маршрутов nginx отдаёт SPA
    # вместо JSON, потому что fallback из location / перехватывает запрос.
    location = /news {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /news/all {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Публичные гайды сайта. Отдельный prefix нужен, чтобы SPA fallback
    # не подменял JSON-ответы index.html.
    location = /public/guides {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/guides/ {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /public/leaderboards {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /authlib-injector.jar {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /authlib-injector/latest.json {
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хэшированные ассеты сборки: имя = контент (main-CID_LOrA.js). Пока
    # деплой катит новый образ, открытые вкладки догружают старые чанки —
    # их нельзя подменять SPA-фоллбэком с 200 и text/html: браузер падает
    # «error loading dynamically imported module», а админ видит красный
    # экран вместо нормального 404. Отдаём честный 404 и кешируем год.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Мобильная SPA под /m/. Свой fallback на m/index.html, чтобы прямые
    # ссылки (/m/builds/5) и перезагрузка страницы не упирались в 404.
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # SPA: всё остальное отдаём index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность (те же заголовки, что у website: админка — ничем не
    # менее защищённая цель, чем сайт).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: всё self-hosted (скрипты/стили/шрифты), blob: — Object URL скинов,
    # 'unsafe-inline' для стилей — инлайновые стили React/контролов.
    # Токен админа живёт в localStorage: CSP режет главный путь его кражи —
    # инжект внешнего скрипта при компрометации зависимости.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
}
