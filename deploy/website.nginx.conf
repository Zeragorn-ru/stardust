# nginx для публичного сайта StarDust.
# Раздаёт статику (HTML/CSS/JS) с кешированием и gzip.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_server admin-server:8081;

    # Public JSON used by the website. The /admin prefix keeps the
    # website deployment independent from the admin-web host.
    # Проксируются ТОЛЬКО публичные пути, которые реально читает сайт
    # (main.js: health, manifest, public/*): раньше сюда попадал весь API
    # admin-server, включая требующие админ-токена эндпоинты — наружу
    # торчала лишняя поверхность (публичный rate-limit на них не действует,
    # ответы ошибок сервера раскрывают внутренности).
    location ~ ^/admin/(health|manifest|public/.*|authlib-injector/(latest\.json|\.jar))$ {
        # regex-location не допускает URI-часть в proxy_pass: срезаем префикс
        # /admin/ через rewrite, proxy_pass идёт без URI.
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$admin_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Без XFF admin-server с TRUST_PROXY=1 не видел бы IP клиентов сайта
        # (все запросы «с nginx»), а его nginx сам XFF не добавляет.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
    # Остальной /admin/ (админские эндпоинты) наружу с сайта не отдаётся.
    location /admin/ {
        return 404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Кеширование статики
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Хэшированные ассеты: честный 404 вместо SPA-фоллбэка с text/html —
    # открытые вкладки при деплое догружают старые чанки (см. admin-web).
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
