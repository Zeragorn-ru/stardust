# Squid: CONNECT-прокси только для доменов, которые нужны лаунчеру,
# запускаемой им JVM и самообновлению. Всё остальное запрещено.
#
# Семантика dstdomain в образе ubuntu/squid (squid 6.13, запинен в
# docker-compose.yml):
#   * запись без точки матчит ТОЛЬКО этот хост;
#   * запись с ведущей точкой (`.example.com`) — домен и все поддомены;
#   * `-n` запрещает обратный DNS-lookup, когда в URL вместо имени стоит
#     IP-адрес. Без `-n` squid резолвит PTR и сравнивает имя с allowlist'ом:
#     владелец IP может прописать себе PTR вида `x.github.com` и пройти
#     мимо allowlist'а. Поэтому `-n` обязателен на каждой строке.
# Проверено на образе из docker-compose.yml (squid 6.13): `dstdomain
# example.com` не пускает www.example.com, а `.example.com` пускает и сам
# домен, и поддомены; `-n` на это не влияет, только отключает PTR.
#
# Список разбит по потребителям, чтобы при очередном 302 было видно, куда
# добавлять новый хост и кто за него отвечает.

# --- Minecraft: манифест версий, client jar, библиотеки, ассеты ---
# launcher/src-tauri/src/minecraft.rs: VERSION_MANIFEST_URL и version JSON
# (piston-meta), client jar и mappings (piston-data), библиотеки версии
# (libraries.minecraft.net), объекты ассетов (resources.download.minecraft.net).
acl allowed_sites dstdomain -n piston-meta.mojang.com piston-data.mojang.com libraries.minecraft.net resources.download.minecraft.net

# --- NeoForge: maven-metadata.xml и installer ---
# minecraft.rs: NEOFORGE_METADATA_URL (latest_neoforge) и
# neoforge-<версия>-installer.jar. Сам installer при этом запускается без
# прокси-аргументов (см. ensure_neoforge), прокси нужен Rust-части.
acl allowed_sites dstdomain -n maven.neoforged.net

# --- Fabric: profile JSON и maven-библиотеки ---
# minecraft.rs: FABRIC_PROFILE_URL = https://meta.fabricmc.net/v2/...
# (ensure_fabric) и url библиотек из профиля — maven.fabricmc.net. Раньше
# обоих хостов не было в allowlist, и «Встроенный прокси Stardust» ломал
# установку Fabric отказом 403.
acl allowed_sites dstdomain -n meta.fabricmc.net maven.fabricmc.net

# --- Java runtime: API вендоров и загрузка сборок ---
# java.rs: метаданные и файлы берутся у вендоров из list_download_vendors():
#   * Temurin: api.adoptium.net отвечает 307 на github.com, тот — 302 на
#     release-assets.githubusercontent.com (оба закрыты .github* ниже);
#   * Corretto: corretto.aws отвечает 302 на файл на том же хосте;
#   * Microsoft: aka.ms отвечает 301 на download.visualstudio.microsoft.com;
#   * Zulu: api.azul.com отдаёт JSON, download_url в нём — cdn.azul.com.
# Oracle (download.oracle.com) сознательно не добавлен: JavaVendor::Oracle
# есть в enum, но ни один путь загрузки до него не доходит — managed() его
# не перечисляет, а команды download_java и install_fixed_java отсекают
# вендора (commands.rs). Oracle можно подключить только вручную путём к java.
acl allowed_sites dstdomain -n api.adoptium.net corretto.aws aka.ms download.visualstudio.microsoft.com api.azul.com cdn.azul.com

# --- Самообновление и релизы authlib-injector ---
# update.rs: список релизов на api.github.com, latest.json и ассеты на
# github.com; после 302 файлы отдаёт release-assets.githubusercontent.com.
# admin-server тянет authlib-injector с github.com, лаунчер получает его
# уже с admin.zeragorn.xyz. Ведущая точка — github.com со всеми
# поддоменами (api/uploads) и githubusercontent.com (objects/
# release-assets/raw). Широко, но закрывает все нынешние и будущие
# CDN-хосты GitHub, на которые уводят редиректы релизов.
acl allowed_sites dstdomain -n .github.com .githubusercontent.com

# --- Инфраструктура Stardust ---
# backend.rs: auth.zeragorn.xyz (логин/сессия/скины) и admin.zeragorn.xyz
# (манифест, новости, /files сборки, /authlib-injector). assets.zeragorn.xyz
# — адрес самого прокси (порт 3128, без nginx-вхоста).
# Новые лаунчеры проксируют эти хосты как раньше (в no_proxy только
# loopback), поэтому записи нужны и им, и уже установленным версиям:
# через squid идут вход, скины, манифест и файлы сборки.
acl allowed_sites dstdomain -n auth.zeragorn.xyz admin.zeragorn.xyz assets.zeragorn.xyz

# --- Сервисы Mojang для запущенной игры ---
# Исторически добавлены для game JVM (authlib-injector обычно перенаправляет
# аутентификацию на наш auth-server, но старые сборки и отключённый инжектор
# могут ходить в Mojang напрямую). `mojang.com` без точки — только apex.
acl allowed_sites dstdomain -n sessionserver.mojang.com api.minecraftservices.com textures.minecraft.net www.minecraft.net mojang.com

# --- Старый fallback authlib-injector ---
# Оставлен для уже установленных версий лаунчера, которые при отказе
# admin-server ходили на yushi.moe. Текущий код (minecraft.rs,
# ensure_authlib_injector) туда не обращается.
acl allowed_sites dstdomain -n authlib-injector.yushi.moe

# Порт CONNECT-цели. Без этого acl прокси пропускает запросы к ЛЮБОМУ порту
# разрешённых хостов — например к admin-server или БД, если они окажутся
# достижимы с хоста squid'а (внутри compose-сети как раз достижимы).
# Лаунчеру и JVM нужны только https (443) и http (80).
acl proxy_ports port 80 443

http_access allow allowed_sites proxy_ports
http_access deny all

http_port 3128

# Лог доступа: squid открыт в сеть, и злоупотребление прокси должно быть
# видно. Ротация — стандартная лог-ротация контейнера.
access_log stdio:/var/log/squid/access.log
