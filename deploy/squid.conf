# Squid: CONNECT-прокси только для доменов которые нужны NeoForge installer
# и лаунчеру. Всё остальное запрещено.

acl allowed_sites dstdomain maven.neoforged.net libraries.minecraft.net piston-meta.mojang.com piston-data.mojang.com resources.download.minecraft.net api.adoptium.net .github.com .githubusercontent.com auth.zeragorn.xyz admin.zeragorn.xyz assets.zeragorn.xyz sessionserver.mojang.com api.minecraftservices.com textures.minecraft.net www.minecraft.net mojang.com authlib-injector.yushi.moe

# Порт CONNECT-цели. Без этого acl прокси пропускает запросы к ЛЮБОМУ порту
# разрешённых хостов — например к admin-server или БД, если они окажутся
# достижимы с хоста squid'а (внутри compose-сети как раз достижимы).
# Лаунчеру и JVM нужны только https (443) и http (80).
acl proxy_ports port 80 443

http_access allow allowed_sites proxy_ports
http_access deny all

http_port 3128

# Не пишем логи доступа (лишний шум).
access_log none
