# Сборка и публикация Docker-образов бекенда в ghcr.io.
#
# Публикуются пять образов: auth-server, admin-server, telegram-bot (slim,
# из готовых бинарей через deploy/runtime.Dockerfile), admin-web (SPA + nginx,
# deploy/admin-web.Dockerfile) и website (лендинг + nginx,
# deploy/website.Dockerfile).
#
# Ключевая оптимизация: тяжёлая Rust-компиляция (lto=fat, codegen-units=1)
# происходит РОВНО ОДИН РАЗ в job `build` — там же тесты и инкрементальный
# кэш cargo (Swatinem/rust-cache). Три бинаря уезжают артефактами, а matrix-job
# `image` лишь пакует готовый бинарь в slim-образ (компиляции в Docker нет).
#
# Деплой автоматический: после успешной сборки и пуша образов CI подключается
# по SSH к серверу и перезапускает контейнеры.

# Один деплой за раз: параллельные прогоны гоняют docker compose down/up
# на одном сервере и роняют друг друга (и окно, когда сервисы выключены).
concurrency:
  group: backend-deploy
  cancel-in-progress: false

name: backend

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "admin-web/**"
      - "website/**"
      - "deploy/runtime.Dockerfile"
      - "deploy/admin-web.Dockerfile"
      - "deploy/admin-web.nginx.conf"
      - "deploy/website.Dockerfile"
      - "deploy/website.nginx.conf"
      - "deploy/squid.conf"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Собрать образы, но не деплоить на сервер"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # КРИТИЧНО: компилируем внутри той же базы (Debian 12 bookworm, glibc 2.36),
    # что и рантайм-образ (debian:bookworm-slim). Иначе бинарь линкуется против
    # более новой glibc раннера (ubuntu-latest = 24.04, glibc 2.39) и падает в
    # рантайме с `version GLIBC_2.38 not found` — glibc только вперёд-совместима.
    # Минор Rust зафиксирован (а не плавающий rust:bookworm), чтобы ключ
    # rust-cache не дрейфовал при выходе новой версии Rust — обновляем осознанно.
    container: rust:1.96-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> target"
          shared-key: "backend"
          # Сохраняем кеш только на мастер-ветке; PR и workflow_dispatch не трогают кеш.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # Сохранять кеш даже при упавшей джобе, чтобы скомпилированные зависимости
          # не пересобирались с нуля на каждом последующем (падающем) прогоне.
          cache-on-failure: true
      - name: Test (auth-server, admin-server, telegram-bot, store, protocol, crash-ai)
        run: cargo test -p auth-server -p admin-server -p telegram-bot -p store -p protocol -p crash-ai
      - name: Clippy (backend)
        run: cargo clippy -p auth-server -p admin-server -p telegram-bot -p store -p protocol -p crash-ai -- -D warnings
      # Тяжёлая release-сборка всех серверных бинарей за один прогон.
      # Инкрементальный target/ переживает прогоны благодаря rust-cache.
      - name: Build release binaries
        run: cargo build --release -p auth-server -p admin-server -p telegram-bot
      # Каждый бинарь — отдельный артефакт, чтобы image-job скачивал только свой.
      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-binaries
          path: |
            target/release/auth-server
            target/release/admin-server
            target/release/telegram-bot
          retention-days: 1
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Rust-сервисы: пакуются из готового бинаря (kind: rust).
          - name: auth-server
            kind: rust
          - name: admin-server
            kind: rust
          - name: telegram-bot
            kind: rust
          # SPA: собирается из исходников (kind: web).
          - name: admin-web
            kind: web
          # Публичный сайт (лендинг): Vite build + nginx (kind: web).
          - name: website
            kind: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          # ghcr.io/<owner>/<repo>/<service> — owner/repo берутся из контекста.
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # latest для ветки + неизменяемый тег по sha коммита.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # --- Rust-сервисы: берём готовый бинарь, пакуем в slim-образ ---
      - name: Download server binaries
        if: matrix.kind == 'rust'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-binaries
          path: bin
      - name: Make binary executable
        if: matrix.kind == 'rust'
        run: chmod +x bin/${{ matrix.name }}
      - name: Build and push (rust)
        if: matrix.kind == 'rust'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          # Контекст — только каталог bin/ с бинарями; компиляции нет.
          context: bin
          file: deploy/runtime.Dockerfile
          target: ${{ matrix.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # --- admin-web: сборка SPA из исходников ---
      - name: Build and push (web)
        if: matrix.kind == 'web' && matrix.name == 'admin-web'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/admin-web.Dockerfile
          target: admin-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # --- website: Vite build + nginx ---
      - name: Generate website release metadata
        if: matrix.kind == 'web' && matrix.name == 'website'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/generate-website-release-metadata.sh website/public/release-metadata.json
      - name: Build and push (website)
        if: matrix.kind == 'web' && matrix.name == 'website'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/website.Dockerfile
          target: website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_deploy != 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Upload deploy files to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/squid.conf"
          # На сервере compose-файлы и data/, logs/ лежат прямо в /opt/stardust.
          # strip_components: 1 срезает префикс deploy/ из путей-источников.
          target: "/opt/stardust/"
          strip_components: 1

      - name: Pull images and restart containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/stardust
            # Фиксируем имя проекта, чтобы контейнеры с жёстким container_name
            # (launcher-*) не оказались "чужими" и не ломали up конфликтом имён.
            export COMPOSE_PROJECT_NAME=stardust
            # docker compose up -d --pull always: сама сравнивает IMAGE ID локально и удалённо,
            # пересоздаёт ТОЛЬКО те контейнеры, чьи образы обновились. Без перезапуска
            # auth-db / squid при деплое только admin-web или website.
            if ! docker compose up -d --pull always --remove-orphans; then
              # Подстраховка: контейнер от старого имени проекта занял container_name.
              for name in launcher-auth-db launcher-auth-server launcher-admin-server \
                          launcher-telegram-bot launcher-squid launcher-admin-web launcher-website; do
                if [ -n "$(docker ps -aq -f "name=^/${name}$" -f "label=com.docker.compose.project!=$COMPOSE_PROJECT_NAME" 2>/dev/null)" ]; then
                  docker rm -f "$name" >/dev/null 2>&1 || true
                fi
              done
              docker compose up -d --pull always --remove-orphans
            fi
            docker compose ps
            failed=0
            for service in auth-server admin-server telegram-bot admin-web; do
              container="launcher-${service}"
              status="$(docker inspect -f '{{.State.Status}}' "$container" 2>/dev/null || true)"
              restart_count="$(docker inspect -f '{{.RestartCount}}' "$container" 2>/dev/null || true)"
              echo "${container}: status=${status:-missing} restart_count=${restart_count:-unknown}"
              if [ "$status" != "running" ]; then
                echo "--- ${container} logs ---"
                docker logs --tail=120 "$container" 2>&1 || true
                failed=1
              elif [ "${restart_count:-0}" -gt 0 ]; then
                echo "--- ${container} logs (restart_count=${restart_count}) ---"
                docker logs --tail=120 "$container" 2>&1 || true
              fi
            done
            if [ "$failed" -ne 0 ]; then
              echo "Один или несколько сервисов не запустились. Вывод контейнеров выше." >&2
              exit 1
            fi
            # Ждём пока сервисы поднимутся (особенно после рестартов из-за race с auth-db).
            sleep 10
            for endpoint in \
              http://127.0.0.1:8080/health \
              http://127.0.0.1:8082/health; do
              ok=0
              for attempt in 1 2 3; do
                if curl --fail --silent --show-error --max-time 10 "$endpoint" >/dev/null 2>&1; then
                  ok=1; break
                fi
                echo "Health check $endpoint attempt $attempt failed, retrying in 5s..."
                sleep 5
              done
              if [ "$ok" -eq 0 ]; then
                echo "Health check $endpoint failed after 3 attempts" >&2
                exit 1
              fi
            done
