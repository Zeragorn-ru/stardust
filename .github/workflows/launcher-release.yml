# Сборка лаунчера (Tauri) и публикация в GitHub Release.
#
# Секреты задаются на уровне job env (не в composite actions).
# macOS job использует environment launcher-release для Apple secrets.

name: launcher-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Платформа (all = matrix)"
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
          - macos

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            platform: windows
            runner: windows-latest
            tauri-args: ""
          - id: linux
            platform: linux
            runner: ubuntu-22.04
            tauri-args: ""
          - id: macos
            platform: macos
            runner: macos-latest
            tauri-args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.runner }}
    # Tauri updater signing keys are stored in this protected environment for
    # every platform, not only macOS.
    environment: launcher-release
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_LAUNCHER_UPDATE_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история не нужна: release notes генерирует GitHub API по тегу,
          # скрипты используют только рабочее дерево.
          fetch-depth: 1

      - name: "① Linux deps"
        if: matrix.platform == 'linux'
        uses: ./.github/actions/launcher-setup-linux

      - name: "② Toolchain & caches"
        uses: ./.github/actions/launcher-setup-toolchain
        with:
          platform: ${{ matrix.runner }}
          cache-key-suffix: release
          save-cache: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: "③ npm ci"
        uses: ./.github/actions/launcher-install-deps

      # Clippy на релизном теге — дублирование: тот же коммит уже прошёл
      # cargo clippy в ci.yml (push/PR в master). Экономит 1-3 мин на leg.
      - name: "④ Clippy"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/actions/launcher-clippy

      - name: "⑤ Bootstrap (Windows)"
        if: startsWith(github.ref, 'refs/tags/') && matrix.id == 'windows'
        uses: ./.github/actions/launcher-build-bootstrap
        with:
          platform: ${{ matrix.runner }}

      - name: "⑥ Set version from tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/launcher-set-version
        with:
          version: ${{ github.ref_name }}

      # Параллельные leg создают релиз одновременно: 422 already_exists в окне
      # между view и create — ретраим, релиз в итоге видят все legs.
      # Каждый новый релиз лаунчера стартует как pre-release: GitHub сам
      # исключает pre-release из указателя latest. Продвижение в stable
      # выполняется позже из админ-панели (не в этом workflow).
      - name: "⑦ Create pre-release"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists"
              exit 0
            fi
            if gh release create "$GITHUB_REF_NAME" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Launcher $GITHUB_REF_NAME" \
              --generate-notes 2>/dev/null; then
              echo "Created release $GITHUB_REF_NAME"
              exit 0
            fi
            echo "Попытка $attempt создать релиз не удалась (гонка leg?), ждём 3с"
            sleep 3
          done
          echo "ERROR: не удалось создать релиз $GITHUB_REF_NAME" >&2
          exit 1

      - name: "⑦ Wait for token"
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/launcher-wait-token

      - name: "⑦a Check signing secrets"
        id: signing
        shell: bash
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: "⑦b macOS signing"
        if: matrix.id == 'macos' && steps.signing.outputs.available == 'true'
        uses: ./.github/actions/launcher-setup-macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: "⑧ Tauri build (unsigned)"
        if: matrix.id != 'macos' || steps.signing.outputs.available != 'true'
        uses: ./.github/actions/launcher-tauri-build
        with:
          tauri-args: ${{ matrix.tauri-args }}
          signing: "false"
          release-tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          upload-updater: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}

      - name: "⑧ Tauri build (signed)"
        if: matrix.id == 'macos' && steps.signing.outputs.available == 'true'
        uses: ./.github/actions/launcher-tauri-build
        with:
          tauri-args: ${{ matrix.tauri-args }}
          signing: "true"
          release-tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          upload-updater: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: "⑧b DMG webloc"
        if: matrix.id == 'macos' && steps.signing.outputs.available == 'true'
        uses: ./.github/actions/launcher-inject-dmg-webloc
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      # ⑨ (удалён): update-macos.sh кладётся в .app самим tauri через
      # bundle.resources (launcher/src-tauri/resources/). Копирование сюда,
      # ПОСЛЕ ⑧ signed build, ломало подпись .app — собранный образ
      # уходил в релиз с повреждённым codesign. Проверка ниже страхует от
      # рассинхрона копии в resources/ со scripts/ci/.
      - name: "⑨ Verify bundled update script (macOS)"
        if: matrix.id == 'macos'
        run: |
          APP_PATH=$(find target -path '*/bundle/macos/*.app' -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            RESOURCES="$APP_PATH/Contents/Resources"
            if [ ! -f "$RESOURCES/update-macos.sh" ]; then
              echo "::error::update-macos.sh не попал в .app (bundle.resources?)"
              # Диагностика: что реально лежит в Resources.
              find "$RESOURCES" -maxdepth 2 -type f | sed 's/^/  /' || true
              exit 1
            fi
            if ! cmp -s "$RESOURCES/update-macos.sh" scripts/ci/update-macos.sh; then
              echo "::error::update-macos.sh в .app отличается от scripts/ci/ — синхронизируй launcher/src-tauri/resources/"
              exit 1
            fi
            echo "update-macos.sh в .app совпадает со scripts/ci/"
          fi

      - name: "⑪ Collect bundles"
        if: always()
        uses: ./.github/actions/launcher-collect-bundles

      - name: "⑫ Upload CI artifacts"
        if: always()
        uses: ./.github/actions/launcher-upload-ci-artifacts
        with:
          artifact-name: launcher-release-${{ matrix.id }}

      - name: "⑬ Upload GitHub Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/launcher-upload-release
        with:
          tag: ${{ github.ref_name }}

  # Keep updater metadata on a dedicated release. The GitHub `latest` release
  # is also used by other artifacts (for example authlib-injector), so it is
  # not a stable updater endpoint.
  # Метаданные апдейтера теперь живут в alias launcher-beta: сюда публикуется
  # каждый новый pre-release. Alias launcher-stable обновляется отдельным
  # действием из админ-панели при продвижении релиза в stable.
  publish-updater-alias:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Alias launcher-beta держит метаданные бета-апдейтера (legacy Rust flow).
      # Alias launcher-stable больше не трогаем: он обновляется действием
      # продвижения релиза из админ-панели, когда pre-release повышают до
      # stable.
      - name: Publish launcher-beta metadata
        shell: bash
        env:
          META_DIR: ${{ runner.temp }}/launcher-meta
        run: |
          mkdir -p "$META_DIR"
          gh release download "$GITHUB_REF_NAME" \
            --pattern latest.json \
            --dir "$META_DIR" \
            --clobber
          # Гонка платформ: каждая leg матрицы пишет latest.json поверх чужой
          # (read-modify-write), и параллельные записи могут потерять платформы.
          # Проверяем, что json содержит все три семейства — darwin, linux,
          # windows; иначе останавливаем релиз, а не отдаём клиентам битый
          # апдейтер (v0.11.4 уехал без darwin именно так).
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["META_DIR"], "latest.json")
          data = json.load(open(path))
          families = {p.split("-")[0] for p in data.get("platforms", {})}
          missing = {"darwin", "linux", "windows"} - families
          if missing:
              platforms = sorted(data.get("platforms", {}).keys())
              print(f"latest.json неполный: нет семейств {sorted(missing)}")
              print(f"Присутствующие платформы: {platforms}")
              sys.exit(1)
          print(f"latest.json OK: {len(data.get('platforms', {}))} платформ, семейства {sorted(families)}")
          PY
          if ! gh release view launcher-beta >/dev/null 2>&1; then
            gh release create launcher-beta \
              --title "StarDust Launcher (beta updater)" \
              --notes "Beta updater metadata alias for launcher releases."
          fi
          gh release upload launcher-beta \
            "$META_DIR/latest.json" --clobber
