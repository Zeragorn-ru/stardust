# Сборка stardust-mod (NeoForge) и stardust-mod-fabric (Fabric) и публикация
# обоих jar в один GitHub Release.
# Триггер — git-тег mod-vX.Y.Z. Для проверки без релиза: ci.yml (target=mod).
#
# Сборки разнесены по job'ам: NeoForge пинит Gradle 8.10.2 + Java 21, а
# Fabric (MC 26.2) требует JVM 25+ — loom 1.19.x не запускается на Java 21.
# Релиз создаётся в отдельном job после обеих сборок, чтобы избежать гонки
# `gh release create` между параллельными job'ами.

name: mod-release

on:
  push:
    tags:
      - "mod-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия мода (без mod-v), для ручного прогона"
        type: string
        default: "0.0.0-dev"
      upload_release:
        description: "Создать/обновить GitHub Release"
        type: boolean
        default: false
      release_tag:
        description: "Тег релиза (mod-vX.Y.Z), если upload_release=true"
        type: string
        default: ""

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#mod-v}"
          bash scripts/ci/set-mod-version.sh "$version"

      - name: Set version (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: bash scripts/ci/set-mod-version.sh "${{ github.event.inputs.version }}"

      - name: Build mod jar (NeoForge)
        working-directory: stardust-mod
        run: ./gradlew build

      - name: Find jar file
        id: find-jar
        run: |
          jar=$(ls stardust-mod/build/libs/*.jar | grep -v sources | head -1)
          echo "jar_path=$jar" >> $GITHUB_OUTPUT
          echo "Found jar: $jar"

      - name: Upload CI artifact (NeoForge)
        uses: actions/upload-artifact@v4
        with:
          name: stardust-mod-jar
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 14

  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Минимум для loom 1.19.x / Minecraft 26.2 (Java 25).
          java-version: 25

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#mod-v}"
          bash scripts/ci/set-mod-version.sh "$version"

      - name: Set version (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: bash scripts/ci/set-mod-version.sh "${{ github.event.inputs.version }}"

      - name: Build mod jar (Fabric)
        working-directory: stardust-mod-fabric
        run: ./gradlew build

      - name: Find jar file
        id: find-jar
        run: |
          fabric_jar=$(ls stardust-mod-fabric/build/libs/*.jar | grep -v sources | head -1)
          echo "jar_path=$fabric_jar" >> $GITHUB_OUTPUT
          echo "Found fabric jar: $fabric_jar"

      - name: Upload CI artifact (Fabric)
        uses: actions/upload-artifact@v4
        with:
          name: stardust-mod-fabric-jar
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 14

  release:
    needs: [build-neoforge, build-fabric]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event.inputs.upload_release == 'true' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stardust-mod-jar
          path: dist-neoforge

      - uses: actions/download-artifact@v4
        with:
          name: stardust-mod-fabric-jar
          path: dist-fabric

      - name: Create release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          title="Stardust Mod $tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --generate-notes
            echo "Created release $tag"
          else
            echo "Release $tag already exists"
          fi

      - name: Upload jars to release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          for jar in dist-neoforge/*.jar dist-fabric/*.jar; do
            bash scripts/ci/sha256-file.sh "$jar" > "${jar}.sha256"
            gh release upload "$tag" "$jar" "${jar}.sha256" --clobber
          done
