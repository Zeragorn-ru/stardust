# Быстрые проверки на push/PR — без релизов и деплоя.
# Для отладки сборки лаунчера используй launcher-build.yml (workflow_dispatch).

name: ci

on:
  push:
    branches: [master]
  pull_request:
    # PR гоняет только задетые пакеты — полный прогон остаётся на push в master.
    paths:
      - "launcher/**"
      - "crates/**"
      - "stardust-mod/**"
      - "stardust-mod-fabric/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Что проверить"
        type: choice
        default: all
        options:
          - all
          - backend
          - launcher
          - admin-web
          - website
          - mod

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'backend'
    runs-on: ubuntu-latest
    container: rust:1.96-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> target"
          shared-key: backend-ci
          cache-on-failure: true
      - name: Test
        run: cargo test -p auth-server -p admin-server -p telegram-bot -p store -p protocol -p crash-ai
      - name: Clippy
        run: cargo clippy -p auth-server -p admin-server -p telegram-bot -p store -p protocol -p crash-ai -- -D warnings

  launcher:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'launcher'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Linux deps
        run: bash scripts/ci/setup-linux-deps.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> target"
          shared-key: launcher-ci
          cache-all-crates: true
          cache-on-failure: true
      - name: Install frontend deps
        working-directory: launcher
        run: npm ci --ignore-scripts
      - name: Frontend build
        working-directory: launcher
        run: npm run build
      - name: Test
        run: cargo test -p launcher
      - name: Clippy
        run: cargo clippy -p launcher --profile launcher-release -- -D warnings

  admin-web:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'admin-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Build
        working-directory: admin-web
        run: npm ci --ignore-scripts && npm run build

  # Два отдельных job'а: NeoForge-мод пинит Gradle 8.10.2 + Java 21, а
  # Fabric-мод (MC 26.2) требует JVM 25+ (loom 1.19.x не стартует на 21).
  mod:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'mod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build (NeoForge)
        working-directory: stardust-mod
        run: ./gradlew build

  mod-fabric:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'mod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          # Сам Gradle и лоадер loom крутятся на этом JDK (минимум 25).
          java-version: 25
          cache: gradle
      - name: Build (Fabric)
        working-directory: stardust-mod-fabric
        run: ./gradlew build

  website:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Build
        working-directory: website
        # npm ci: версии фиксируются package-lock.json (лежит в репе);
        # install --no-package-lock ставил свежие минорные версии каждый прогон.
        run: npm ci && npm run build
      - name: Build Docker image (dry-run)
        run: docker build -f deploy/website.Dockerfile -t website-ci .
