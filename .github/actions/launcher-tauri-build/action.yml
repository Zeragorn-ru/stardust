name: Launcher — Tauri build
description: |
  Собирает установщики через tauri-action. GITHUB_TOKEN и APPLE_* передаются
  через env шага workflow (не secrets внутри composite action).

inputs:
  tauri-args:
    description: Доп. аргументы tauri build (напр. --target universal-apple-darwin)
    required: false
    default: ""
  release-draft:
    description: Черновик релиза (для отладочных сборок)
    required: false
    default: "false"
  prerelease:
    description: Пометить как prerelease
    required: false
    default: "false"
  signing:
    description: "Включить Apple code signing (true/false)"
    required: false
    default: "true"
  release-tag:
    description: "Stable GitHub release tag for signed updater metadata"
    required: false
    default: ""
  upload-updater:
    description: "Upload signed Tauri updater metadata and signatures"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Tauri build (unsigned)
      if: inputs.signing != 'true'
      uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
      env:
        CI: true
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        projectPath: launcher
        tagName: ${{ inputs.release-tag }}
        releaseCommitish: ${{ github.sha }}
        releaseDraft: ${{ inputs.release-draft }}
        prerelease: ${{ inputs.prerelease }}
        includeUpdaterJson: ${{ inputs.upload-updater }}
        args: ${{ inputs.tauri-args }} -- --profile launcher-release

    - name: Tauri build (signed)
      if: inputs.signing == 'true'
      uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
      env:
        CI: true
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
        # Нотаризационные APPLE_ID/APPLE_PASSWORD/APPLE_API_* НЕ маппим: даже
        # пустая строка для bundler означает «нотаризуем» → падение. Вернуть при
        # появлении Apple Developer-аккаунта (см. launcher-release.yml ⑧).
      with:
        projectPath: launcher
        tagName: ${{ inputs.release-tag }}
        releaseCommitish: ${{ github.sha }}
        releaseDraft: ${{ inputs.release-draft }}
        prerelease: ${{ inputs.prerelease }}
        includeUpdaterJson: ${{ inputs.upload-updater }}
        args: ${{ inputs.tauri-args }} -- --profile launcher-release
