name: Launcher — Toolchain & caches
description: |
  Node 20, Rust 1.96 + clippy, rust-cache и npm cache.
  На macOS дополнительно добавляет x86_64-apple-darwin для universal-сборки
  (aarch64 уже есть на macos-latest runner).

inputs:
  platform:
    description: Runner OS label (windows-latest | ubuntu-22.04 | macos-latest)
    required: true
  cache-key-suffix:
    description: Суффикс ключа кеша (release | build)
    required: false
    default: release
  save-cache:
    description: Сохранять rust-cache (true на тегах)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: launcher/package-lock.json

    - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
      with:
        components: clippy

    - name: macOS universal target (x86_64)
      if: inputs.platform == 'macos-latest'
      shell: bash
      run: rustup target add x86_64-apple-darwin

    # cache-all-crates кеширует ПОЗАКЕШНО: bump одной зависимости в Cargo.lock
    # инвалидирует только её запись, а не весь кеш. shared-key стабилен между
    # прогонами, но GitHub изолирует кэш по ref: тег не видит кэш другого тега.
    # Релизные ключи греет launcher-cache-warm.yml на master (см. там).
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: ". -> target"
        shared-key: launcher-${{ inputs.cache-key-suffix }}-${{ inputs.platform }}
        cache-all-crates: true
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-on-failure: true
